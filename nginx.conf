server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # MIME types
    types {
        application/javascript js;
        application/json json;
        application/manifest+json webmanifest;
        text/css css;
        text/html html;
        image/svg+xml svg;
        image/x-icon ico;
        image/png png;
        image/jpeg jpeg jpg;
        image/gif gif;
        image/webp webp;
        font/woff2 woff2;
        font/woff woff;
        application/font-woff woff;
        application/octet-stream wasm;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # SPA fallback - HTML never cached
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend:6895/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # WebSocket proxy
    location /websocket/ {
        proxy_pass http://backend:6895/websocket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # MCP (Model Context Protocol) 端点，供本地 AI 助理连接。
    #
    # 这条 location 不能省，也不能指望上面的 `location /api/` 兜住（端点也因此刻意<不>放在
    # /api 前缀下）：那条规则是 proxy_read_timeout 120s 且默认开着 buffering，而 MCP 走的是
    # Streamable HTTP，长连接两样都受不了。
    #
    # 症状很有迷惑性：初始化握手正常、工具列表也拿得到，只有跑得久一点的调用会莫名断线——
    # 因为那些才是真正用上 SSE 流的请求。
    #
    # 认证由后端的 McpAuthFilter 做（Authorization: Bearer osr_mcp_xxx），这里只需把头透传过去。
    location /mcp {
        proxy_pass http://backend:6895/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # SSE 必须：开着缓冲的话事件会被攒在 nginx 里，客户端一直收不到
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
    }

    # Service Worker files
    #
    # 正则的三个分支都必须带 \.js —— 原先写的是 `^/(sw|registerSW|workbox-[^/]+\.js)$`，
    # 前两个分支少了扩展名，于是 /sw.js 与 /registerSW.js **根本不匹配这个块**，
    # 掉进下面的静态资源块被打上 `Cache-Control: no-store`。
    # 后果是 Service Worker 注册直接失败（Chromium 报
    # "An unknown error occurred when fetching the script."），
    # 连带整个 PWA 的版本更新提示失效 —— 用户只能靠手动清浏览器缓存才能拿到新版前端。
    #
    # 这个 bug 极其隐蔽：/sw.js 照样返回 200 和正确的 MIME，curl 完全看不出问题，
    # 在页面里 fetch('/sw.js') 也能拿到内容，**只有 register() 会失败**。
    # 判断有没有命中这个块，看响应头里有没有 Service-Worker-Allowed 最直接。
    #
    # SW 脚本用 no-cache（每次带条件请求回源校验）而不是 no-store（完全不存）：
    # 浏览器需要能对比新旧脚本字节是否变化来决定要不要触发更新流程。
    location ~* ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        add_header Access-Control-Allow-Origin "*";
        expires off;
    }

    # Manifest file
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Access-Control-Allow-Origin "*";
        expires off;
    }

    # Static assets - no cache to force fresh loads
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header ETag "";
        expires off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
