name: Build & Push Docker Images (release)

on:
  push:
    tags:
      - 'v*'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  IMAGE_NAME: osr

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.set-output.outputs.backend }}
      frontend: ${{ steps.set-output.outputs.frontend }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes from previous tag
        id: set-output
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          # 获取上一个 tag（排除当前 tag）
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -n 1)
          
          if [ -z "$PREV_TAG" ]; then
            # 第一个 tag，对比首次提交到当前
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          
          echo "Comparing: $PREV_TAG...$CURRENT_TAG"
          
          # 检测后端变更
          #
          # osr-* 保留通配、只排掉 osr-web：前端目录也叫 osr-web，`osr-*/**` 会把它一并
          # 算进后端，于是纯前端的版本每次都白跑一次后端构建（v3.3.11 就是这么跑的）。
          # 不改成逐个列出后端模块，是因为两种漏法的代价不对等——列表漏登记一个新模块，
          # 后端就不会重新构建，发出去的版本里装的是上一版的后端镜像，而且不报任何错；
          # 排除法漏排一个新的前端目录，最坏结果只是多跑一次构建。
          BACKEND_FILES=$(git diff --name-only "$PREV_TAG" "$CURRENT_TAG" -- \
            "osr-*/**" ":(exclude)osr-web/**" "pom.xml" "mvnw" "Dockerfile.backend" \
            ".github/workflows/docker-publish-tag.yml" 2>/dev/null || true)
          
          if [ -n "$BACKEND_FILES" ]; then
            echo "Backend files changed:"
            echo "$BACKEND_FILES"
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "No backend changes"
            echo "backend=false" >> $GITHUB_OUTPUT
          fi
          
          # 检测前端变更
          #
          # nginx.conf 必须列进来：它在仓库根目录，但 Dockerfile.frontend 会把它 COPY 进
          # 前端镜像，所以它是<前端产物的一部分>。漏掉的话，只改 nginx.conf 的版本不会重新
          # 构建前端，发出去的镜像里装的仍是上一版的 nginx 配置，而且不报任何错——与上面
          # 后端那段注释里说的漏法完全同型。v3.3.31 给 MCP 加 /mcp 那条 location 时正好
          # 撞上这个盲区（那次因为 osr-web/ 也改了才没暴露）。
          FRONTEND_FILES=$(git diff --name-only "$PREV_TAG" "$CURRENT_TAG" -- \
            "osr-web/**" "Dockerfile.frontend" "nginx.conf" \
            ".github/workflows/docker-publish-tag.yml" 2>/dev/null || true)
          
          if [ -n "$FRONTEND_FILES" ]; then
            echo "Frontend files changed:"
            echo "$FRONTEND_FILES"
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "No frontend changes"
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build backend with Maven
        run: mvn -B package -DskipTests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: osr-web/package-lock.json

      - name: Install frontend dependencies
        run: npm install
        working-directory: osr-web

      - name: Build frontend
        run: npm run build
        working-directory: osr-web

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-frontend:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    needs: [detect-changes, build-backend, build-frontend]
    runs-on: ubuntu-latest
    # 必须带 !cancelled()：GitHub Actions 默认把「依赖被跳过」也当作不满足 needs，
    # 于是只改了后端的版本（build-frontend 被 detect-changes 跳过）会连带跳过本 job，
    # 打了 tag、镜像也推了，却没有 release——v3.3.6 就是这么漏的，只能事后手工补建。
    # 放开跳过的同时必须挡住真失败：构建挂了还发 release，等于对外宣告一个装着旧镜像的版本。
    # 因此逐个依赖判 success/skipped，而不是笼统的 always()。
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.detect-changes.result == 'success'
      && (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped')
      && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    steps:
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Release ${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          draft: false
          prerelease: false
