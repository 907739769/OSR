# 项目相关配置
osr:
  # 名称
  name: OpenListStrm
  # 版本
  version: 1.0.4
  # 版权年份
  copyrightYear: 2025
  # 文件路径 示例（ Windows配置D:/osr/uploadPath，Linux配置 /home/osr/uploadPath）
  profile: /data/upload
  # 获取ip地址开关
  addressEnabled: false

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为80
  port: 6895
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200（虚拟线程模式下仅作为上限）
      max: 800
      # Tomcat启动初始化的线程数，默认值10（虚拟线程模式下可减小）
      min-spare: 100
 
# 日志配置
#
# 这里刻意<不>再配 logging.level.*，级别的唯一来源是 logback-spring.xml。
#
# 原因：Spring Boot 的 logging.level.* 是在 logback 配置加载「之后」应用的，两边写了同一个
# logger 时永远是这里赢。此前 application.yml 写 `com.osr: debug`、logback-spring.xml 写
# `<logger name="com.osr" level="info"/>`，于是整个 com.osr.*（连带 osr-system、osr-framework、
# osr-common）实际跑在 DEBUG，而读 logback 配置的人会得出完全相反的结论——两份配置各自都
# 「看起来是对的」，只有把它们放在一起看才发现矛盾。
#
# 要调级别请改 logback-spring.xml 里的 <logger>；临时排查可以用环境变量
# LOGGING_LEVEL_COM_OSR=debug 单次覆盖，不必改文件。

# 用户配置
user:
  password:
    # 密码错误{maxRetryCount}次锁定10分钟
    maxRetryCount: 5

# Spring配置
spring:
  threads:
    virtual:
      enabled: true
  messages:
    basename: classpath:i18n/messages
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    # Spring Boot 4 + Jackson 3 特性
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  cache:
    type: simple
  main:
    banner-mode: console
    allow-bean-definition-overriding: true
    # Spring Boot 4 特性：允许循环引用（默认已开启）
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
# MyBatis Plus配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.osr.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /druid
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*,/api/*

# 防止csrf攻击
csrf:
  # 过滤开关
  enabled: false
  # 白名单（多个用逗号分隔）
  whites: /druid

# JWT配置
jwt:
  secret: ${JWT_SECRET:}
  expiration: 7200000
  refresh-expiration: 604800000

# 敏感配置加密密钥（PT 下载器密码、索引器 apikey 等落库前加密）
openliststrm:
  security:
    credential-secret: ${PT_CREDENTIAL_SECRET:}

# PT 订阅：索引器请求节流。所有打向 Torznab 的请求（RSS 轮询/关键词搜索/ID 搜索/caps 探测）
# 都经由 IndexerRateLimiter 收口，这里的值直接决定站点侧看到的请求密度。
# 调小 min-request-interval-ms 会显著提高被 NexusPHP 判定为异常访问的风险，非必要不要动。
pt:
  indexer:
    # 同一索引器两次请求的最小间隔（毫秒）
    min-request-interval-ms: 2000
    # 跨所有索引器的全局并发上限。这是搜索/轮询扇出的真正上限——每索引器的串行化与最小
    # 间隔（上面两项）已经护住了单个站点，这里限的是「同时打几个不同站点」。索引器多于该值时
    # 后来的请求要在限流器里排队，等待超过 max-wait-ms 会被跳过，因此不宜低于常用索引器数量
    global-concurrency: 50
    # 等待限流许可超过该时长直接跳过本次请求，避免用户手动搜索被冷却期挂死
    max-wait-ms: 30000
    # 单轮 RSS 轮询内部的次级并发闸门（真正的节流见上面三项）
    max-concurrency: 4
    # 连续失败自动停用后，多久做一次自愈探测（小时）
    self-heal-cooldown-hours: 2
    # t=caps 能力探测失败后多久允许重探（毫秒）。探测成功的结果进程内永久缓存，
    # 失败的只缓存这么久——否则一次网络抖动或限流冷却就会让该索引器在整个进程生命周期内
    # 永远走不到 imdbid/tmdbid 精确搜索，只剩关键词兜底，且无从察觉
    caps-retry-after-failure-ms: 300000
  search:
    # 单个索引器跑完整份检索计划（ID 精确 + 各关键词变体，最多 6 步）的时间预算（毫秒）。
    # 一个慢站点会独占整个搜索的墙钟——实测 7 个索引器里 6 个在 31 秒内跑完，第 7 个拖到 56 秒，
    # 而它多跑的几步一条有用结果都没带回来。超预算的索引器放弃尾部步骤，已完成的结果照常参与匹配。
    # 注意这是「不再开始新步骤」的软上限，不打断已发出的请求（读超时另有 60 秒），
    # 因此最坏耗时是「预算 + 最后一步的实际耗时」。设为 0 表示不限制。
    indexer-budget-ms: 30000
    # 定期自动补搜「扫一轮」的总耗时预算（毫秒）。订阅之间是串行的，一条剧集订阅最坏要
    # 40~50 秒（上面那个预算是软上限），几十条订阅就能跑过 AutoSearchTask 的 30 分钟心跳，
    # 让下一次心跳被重叠保护整个吞掉。超预算时剩下的订阅原样留到下一轮（它们的
    # last_search_time 没被改动，下轮天然从断点接着搜），因此这个值只影响单轮时长、不影响覆盖。
    # 刻意不用并发解决：IndexerRateLimiter 是全局的，多条订阅同时搜只会在限流器上排队并撞
    # max-wait-ms 静默跳过。设为 0 表示不限制。
    auto-search-round-budget-ms: 1200000
    # 季搜索的候选池里一集都没匹配上时，最多为几集补发「真正的单集检索」；0 表示关闭。
    # 补搜的四步检索全是季粒度（season=23、关键词「片名 S23」），而多数索引器把 q 按空格切词
    # 做 AND 匹配，「S23」命不中标题里的「S23E05」——单集在索引器那一层就没返回，本地怎么匹配
    # 都是空。表现为「后台补搜只会下季包，单集永远要用户自己去逐集手动搜」，长篇动画尤其常见。
    # 这一步把请求量从 O(N+M) 打回 O(N×M)，所以只作为兜底：本地匹配得上的集一个请求都不多发。
    # 集号升序取前 N 集，其余留到下一轮（会 warn 出来，不会静默丢掉）。
    per-episode-fallback-limit: 5
    # 上面那段补发的墙钟预算（毫秒），0 表示不限制。同样是「不再开始新的一集」的软上限。
    # 单给一个预算而不是只按集数算：一集的耗时摆动很大（第一级命中就早停，几秒；三级全打满
    # 且全落空，四十秒往上），而补发恰恰发生在「季搜索里没这集」的订阅上，走满三级是常态。
    # 只按集数算的话最坏耗时会翻几倍地超出预期，进而吃掉上面那一轮的额度。
    # 缺集体检页的「立即补搜」是同步等结果的，改大这两个值要一并调前端 searchMissingApi 的超时。
    per-episode-fallback-budget-ms: 180000
    # 「季包优先」所需的最少缺集数：本轮要补的集少于这个数时，先试候选池里精确的单集资源，
    # 逐集补不上的再退回季包兜底。0 表示恒季包优先。
    # 季包的价值在于一次补一大批。只缺零星几集时它是笔亏本买卖：下几十 GB 换一集，多背一整包的
    # 保种义务；而且包里到底有没有那一集，要等下载器返回文件列表才知道——不含的话这一轮整个白跑
    # （NO_TARGET_EPISODE 中止、删种、集退回缺失），下一轮换个发布组的季包再来一遍。
    # 更糟的是它会结构性地饿死单集资源：季包推送成功后本轮要重查集状态，被它占位的集在本轮逐集
    # 分支里已不是 MISSING、直接跳过；等对账把它退回缺失，下一轮季包又抢先占一次。站上季包版本
    # 一多（不同发布组/分辨率各一个），「明明有单独的第 41 集，就是永远不下」就成了稳态。
    # 默认 3：缺 1~2 集基本都是追更中的最新集（站上一定是先有单集、后有合集），
    # 缺 3 集往上多半是断档或新建订阅，那时一个季包一次补齐反而更省。
    season-pack-min-missing: 3
  clean:
    # 自动删种的扫描周期（分钟）。删种的判据是"做种够久了"，以小时计，
    # 调到分钟级只会让每一轮把整个保种盘的种子列表白拉一遍。
    # 是否真的删种由每个下载器自己的开关与规则决定，这里只是扫描节奏
    interval-minutes: 60
  library:
    # 媒体库对账（LibrarySyncTask，每 10 分钟）同时处理几条订阅。
    # 这里能并发而自动补搜不能，差别在下游是谁：补搜打索引器、受全局 IndexerRateLimiter 约束，
    # 并发只会在限流器上排队并撞 max-wait-ms 静默跳过；对账打的是 Emby（局域网自建服务）
    # 与 TMDb（已有全局 Semaphore(4) 兜底，且详情有两级缓存，很少真的发请求）。
    # 上限的真正卡点是数据库连接：SubscriptionService#refresh 带 @Transactional，事务里夹着
    # 一次 Emby 网络往返，因此每条并发对账都会在整个往返期间占住一个连接。Druid maxActive=50，
    # 4 条无关痛痒；要调到几十请先想清楚那是在跟所有在线请求抢连接。0 或负数按 1 处理。
    sync-concurrency: 4

# 可观测性（Spring Boot Actuator）
#
# 两道锁，缺一不可：
#   1) 这里的白名单决定「有什么可访问」——只开 health/info/metrics/prometheus 四个。
#      刻意<不>开 env（会把含数据库密码在内的全部配置原样吐出来）与 heapdump（直接给出内存快照）。
#   2) SecurityConfig 里的 ACTUATOR_ANONYMOUS 决定「谁能访问」——默认 false，即仍要求 JWT。
#      内网 Prometheus 抓取需显式设 ACTUATOR_ANONYMOUS=true，那时第 1 道锁就是唯一防线，
#      所以上面那份白名单不要随手加东西。
#
# 端口沿用 6895 而不是另开管理端口：另开的话它不经过主 SecurityFilterChain，
# 一旦有人顺手把那个端口也映射出去，就是彻底裸奔。
#
# Docker 的 healthcheck 仍然打 /api/health（匿名端点，只探数据库），不改成 /actuator/health：
# 后者受上面第 2 道锁约束，默认要 JWT，拿它做探针会让容器永远 unhealthy。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 不对外泄露各组件明细（磁盘路径、数据库连接串等），只给 UP/DOWN
      show-details: never
  metrics:
    tags:
      application: OpenListStrm
