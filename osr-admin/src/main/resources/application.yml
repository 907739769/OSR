# 项目相关配置
osr:
  # 名称
  name: OpenListStrm
  # 版本
  version: 1.0.4
  # 版权年份
  copyrightYear: 2025
  # 文件路径 示例（ Windows配置D:/osr/uploadPath，Linux配置 /home/osr/uploadPath）
  profile: /data/upload
  # 获取ip地址开关
  addressEnabled: false

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为80
  port: 6895
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200（虚拟线程模式下仅作为上限）
      max: 800
      # Tomcat启动初始化的线程数，默认值10（虚拟线程模式下可减小）
      min-spare: 100
 
# 日志配置
logging:
  level:
    com.osr: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码错误{maxRetryCount}次锁定10分钟
    maxRetryCount: 5

# Spring配置
spring:
  threads:
    virtual:
      enabled: true
  messages:
    basename: classpath:i18n/messages
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    # Spring Boot 4 + Jackson 3 特性
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  cache:
    type: simple
  main:
    banner-mode: console
    allow-bean-definition-overriding: true
    # Spring Boot 4 特性：允许循环引用（默认已开启）
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
# MyBatis Plus配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.osr.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /druid
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*,/api/*

# 防止csrf攻击
csrf:
  # 过滤开关
  enabled: false
  # 白名单（多个用逗号分隔）
  whites: /druid

# JWT配置
jwt:
  secret: ${JWT_SECRET:}
  expiration: 7200000
  refresh-expiration: 604800000

# 敏感配置加密密钥（PT 下载器密码、索引器 apikey 等落库前加密）
openliststrm:
  security:
    credential-secret: ${PT_CREDENTIAL_SECRET:}

# PT 订阅：索引器请求节流。所有打向 Torznab 的请求（RSS 轮询/关键词搜索/ID 搜索/caps 探测）
# 都经由 IndexerRateLimiter 收口，这里的值直接决定站点侧看到的请求密度。
# 调小 min-request-interval-ms 会显著提高被 NexusPHP 判定为异常访问的风险，非必要不要动。
pt:
  indexer:
    # 同一索引器两次请求的最小间隔（毫秒）
    min-request-interval-ms: 2000
    # 跨所有索引器的全局并发上限。这是搜索/轮询扇出的真正上限——每索引器的串行化与最小
    # 间隔（上面两项）已经护住了单个站点，这里限的是「同时打几个不同站点」。索引器多于该值时
    # 后来的请求要在限流器里排队，等待超过 max-wait-ms 会被跳过，因此不宜低于常用索引器数量
    global-concurrency: 50
    # 等待限流许可超过该时长直接跳过本次请求，避免用户手动搜索被冷却期挂死
    max-wait-ms: 30000
    # 单轮 RSS 轮询内部的次级并发闸门（真正的节流见上面三项）
    max-concurrency: 4
    # 连续失败自动停用后，多久做一次自愈探测（小时）
    self-heal-cooldown-hours: 2
    # t=caps 能力探测失败后多久允许重探（毫秒）。探测成功的结果进程内永久缓存，
    # 失败的只缓存这么久——否则一次网络抖动或限流冷却就会让该索引器在整个进程生命周期内
    # 永远走不到 imdbid/tmdbid 精确搜索，只剩关键词兜底，且无从察觉
    caps-retry-after-failure-ms: 300000
  search:
    # 单个索引器跑完整份检索计划（ID 精确 + 各关键词变体，最多 6 步）的时间预算（毫秒）。
    # 一个慢站点会独占整个搜索的墙钟——实测 7 个索引器里 6 个在 31 秒内跑完，第 7 个拖到 56 秒，
    # 而它多跑的几步一条有用结果都没带回来。超预算的索引器放弃尾部步骤，已完成的结果照常参与匹配。
    # 注意这是「不再开始新步骤」的软上限，不打断已发出的请求（读超时另有 60 秒），
    # 因此最坏耗时是「预算 + 最后一步的实际耗时」。设为 0 表示不限制。
    indexer-budget-ms: 30000
    # 定期自动补搜「扫一轮」的总耗时预算（毫秒）。订阅之间是串行的，一条剧集订阅最坏要
    # 40~50 秒（上面那个预算是软上限），几十条订阅就能跑过 AutoSearchTask 的 30 分钟心跳，
    # 让下一次心跳被重叠保护整个吞掉。超预算时剩下的订阅原样留到下一轮（它们的
    # last_search_time 没被改动，下轮天然从断点接着搜），因此这个值只影响单轮时长、不影响覆盖。
    # 刻意不用并发解决：IndexerRateLimiter 是全局的，多条订阅同时搜只会在限流器上排队并撞
    # max-wait-ms 静默跳过。设为 0 表示不限制。
    auto-search-round-budget-ms: 1200000
  clean:
    # 自动删种的扫描周期（分钟）。删种的判据是"做种够久了"，以小时计，
    # 调到分钟级只会让每一轮把整个保种盘的种子列表白拉一遍。
    # 是否真的删种由每个下载器自己的开关与规则决定，这里只是扫描节奏
    interval-minutes: 60
